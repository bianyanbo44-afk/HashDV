[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashdv"
version = "0.1.0"
description = "Instance verification and fixed-test leakage measurement for industrial defect benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=2.0", "scipy>=1.10", "Pillow>=10", "ImageHash>=4.3"]

[project.optional-dependencies]
inference = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0", "safetensors>=0.4", "opencv-python>=4.8"]
training = ["ultralytics==8.4.115", "PyYAML>=6"]
test = ["pytest>=8"]

[project.scripts]
hashdv = "hashdv.cli:main"

[tool.setuptools.packages.find]
include = ["hashdv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
